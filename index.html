<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Géolocalisation + Punaises (≤100m)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f6f9;
      text-align: center;
    }
    h1 { margin: 18px 0 8px; }
    #info {
      margin: 0 12px 10px;
      font-size: 15px;
      line-height: 1.4;
    }
    #map {
      height: 520px;
      width: 92%;
      margin: 0 auto 18px auto;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      background: #ddd;
    }
    .btns { margin-bottom: 10px; }
    button {
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      margin: 0 6px 8px;
    }
    code { background: rgba(0,0,0,0.06); padding: 2px 5px; border-radius: 5px; }
  </style>
</head>

<body>
  <h1>📍 Ma Position + 5 Punaises autour</h1>
  <div id="info">En attente de la position...</div>

  <div class="btns">
    <button onclick="copyMyCoords()">📋 Copier MA position</button>
    <button onclick="centerOnMe()">🎯 Centrer sur moi</button>
    <button onclick="regeneratePins()">🎲 Regénérer les 5 punaises</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const UPDATE_EVERY_MS = 1000;
    const NUM_PINS = 5;
    const MAX_RADIUS_M = 100;

    let currentLat = null;
    let currentLng = null;
    let currentAccuracy = null;
    let myMarker = null;
    let pins = [];
    let pinsGenerated = false;

    const map = L.map('map').setView([0, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function toRad(deg) { return deg * Math.PI / 180; }
    function toDeg(rad) { return rad * 180 / Math.PI; }

    function distanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const φ1 = toRad(lat1), φ2 = toRad(lat2);
      const Δφ = toRad(lat2 - lat1);
      const Δλ = toRad(lon2 - lon1);
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function randomPointWithinMeters(lat, lng, maxMeters) {
      const R = 6371000;
      const bearing = Math.random() * 2 * Math.PI;
      const distance = Math.sqrt(Math.random()) * maxMeters;

      const φ1 = toRad(lat);
      const λ1 = toRad(lng);
      const δ = distance / R;

      const sinφ1 = Math.sin(φ1), cosφ1 = Math.cos(φ1);
      const sinδ = Math.sin(δ), cosδ = Math.cos(δ);
      const sinθ = Math.sin(bearing), cosθ = Math.cos(bearing);

      const φ2 = Math.asin(sinφ1 * cosδ + cosφ1 * sinδ * cosθ);
      const λ2 = λ1 + Math.atan2(sinθ * sinδ * cosφ1, cosδ - sinφ1 * Math.sin(φ2));

      return { lat: toDeg(φ2), lng: toDeg(λ2), distance };
    }

    function setInfo(textHtml) {
      document.getElementById("info").innerHTML = textHtml;
    }

    function updateMyMarker() {
      if (currentLat === null || currentLng === null) return;

      const latlng = [currentLat, currentLng];
      if (!myMarker) {
        myMarker = L.marker(latlng).addTo(map).bindPopup("📍 Ma position");
      } else {
        myMarker.setLatLng(latlng);
      }
    }

    function centerOnMe() {
      if (currentLat === null || currentLng === null) return;
      map.setView([currentLat, currentLng], 17);
    }

    function copyMyCoords() {
      if (currentLat === null || currentLng === null) {
        alert("Position non disponible.");
        return;
      }
      const text = `${currentLat}, ${currentLng}`;
      navigator.clipboard.writeText(text);
      alert("Coordonnées copiées !");
    }

    function clearPins() {
      pins.forEach(m => map.removeLayer(m));
      pins = [];
      pinsGenerated = false;
    }

    function generatePinsAroundMe() {
      if (currentLat === null || currentLng === null) return;

      clearPins();

      for (let i = 0; i < NUM_PINS; i++) {
        const p = randomPointWithinMeters(currentLat, currentLng, MAX_RADIUS_M);
        const marker = L.marker([p.lat, p.lng]).addTo(map);

        marker.on("click", () => {
          if (currentLat === null || currentLng === null) {
            marker.bindPopup("Position actuelle inconnue.").openPopup();
            return;
          }

          const d = distanceMeters(currentLat, currentLng, p.lat, p.lng);
          const html = `
            <div style="min-width: 220px; text-align: left;">
              <div><strong>📌 Punaise #${i+1}</strong></div>
              <div><strong>Lat:</strong> <code>${p.lat.toFixed(6)}</code></div>
              <div><strong>Lng:</strong> <code>${p.lng.toFixed(6)}</code></div>
              <div><strong>Distance:</strong> <code>${Math.round(d)}</code> m</div>
            </div>
          `;
          marker.bindPopup(html).openPopup();
        });

        pins.push(marker);
      }

      pinsGenerated = true;
    }

    function regeneratePins() {
      if (currentLat === null || currentLng === null) {
        alert("Position non disponible.");
        return;
      }
      generatePinsAroundMe();
      alert("5 punaises régénérées.");
    }

    function refreshPosition() {
      if (!navigator.geolocation) {
        setInfo("La géolocalisation n'est pas supportée.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          currentLat = position.coords.latitude;
          currentLng = position.coords.longitude;
          currentAccuracy = position.coords.accuracy;

          updateMyMarker();

          // AUTO CENTER EACH UPDATE
          map.setView([currentLat, currentLng], map.getZoom());

          if (!pinsGenerated) {
            generatePinsAroundMe();
            map.setView([currentLat, currentLng], 17);
          }

          const now = new Date();
          setInfo(`
            <div>
              <strong>Ma position:</strong> 
              <code>${currentLat.toFixed(6)}</code> , 
              <code>${currentLng.toFixed(6)}</code>
              | précision <code>${Math.round(currentAccuracy)}</code> m
            </div>
            <div style="opacity:0.8;font-size:13px;margin-top:4px;">
              Mise à jour: ${now.toLocaleTimeString()} (1s)
            </div>
          `);
        },
        (error) => {
          setInfo("Erreur de géolocalisation.");
          console.error(error);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 8000
        }
      );
    }

    refreshPosition();
    setInterval(refreshPosition, UPDATE_EVERY_MS);
  </script>
</body>
</html>
